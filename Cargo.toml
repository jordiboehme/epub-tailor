[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/testfixtures", "xtask", "app/src-tauri"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/jordiboehme/epub-tailor"
version = "0.8.0"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
encoding_rs = "0.8"
indexmap = "2"
kuchikiki = "0.8"
html5ever = "0.26"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "tiff",
    "bmp",
] }
jpeg-encoder = "0.7"
# `text` renders `<text>` with the bundled font; `raster-images` lets an SVG's
# embedded `<image>` rasters render. `system-fonts`/`memmap-fonts` are off so
# rendering is deterministic and offline (only the bundled DejaVu Sans is used).
resvg = { version = "0.48", default-features = false, features = [
    "text",
    "raster-images",
] }
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = [
    "visitor",
] }
unicode-normalization = "0.1"
# Multi-pattern substring search, for the pruning safety net: it must look for
# every dropped file's basename in every surviving document, which as a needle
# loop is O(dropped x bytes). Already in the tree via `regex`.
aho-corasick = "1"
sha1 = "0.10"
# Default features pull in the standalone `comrak` CLI binary (clap, bon,
# shell-words, xdg) and syntax highlighting (syntect-onig) - none of which we
# use (M3 already owns code-block handling); dropping them also drops
# `fmt2io` (MITNFA, not on the license allow-list) and syntect's `bincode`/
# `yaml-rust` transitive deps (both unmaintained per `cargo deny`).
comrak = { version = "0.54", default-features = false }
serde_yaml_ng = "0.10"
askama = "0.16"
# Blocking HTTP for the optional Open Library lookup. Deliberately ureq: it is
# sync by design, so no tokio ever enters this tree.
ureq = { version = "3", default-features = false, features = ["rustls", "json", "gzip"] }
time = { version = "0.3", features = ["formatting"] }
proptest = "1"
insta = "1"
epub-tailor-core = { path = "crates/core", version = "0.8.0" }
# Dev-only EPUB fixture primitives, shared by the core and CLI integration
# tests (which cannot import each other's test modules). No `version`: it is
# `publish = false` and never leaves the workspace.
epub-tailor-testfixtures = { path = "crates/testfixtures" }

[workspace.lints.clippy]
# Intentionally empty: keep clippy's default lint levels.
# CI enforces `-D warnings` on the command line (see .github/workflows/ci.yml).

[profile.dev]
# Line tables instead of full DWARF (the `debug = 2` default): panics and
# backtraces keep file:line, target/debug shrinks by ~20% (measured), and the
# ~25 test-binary links push less debuginfo around. The only loss is variable
# inspection in an interactive debugger. `profile.test` inherits this;
# release is untouched.
debug = "line-tables-only"

# Build every DEPENDENCY (not our own workspace members - those stay at the
# unoptimized default so `cargo build`/`nextest run` on this crate's own code
# keeps recompiling fast) at opt-level 2. `resvg`, `image`, `lightningcss` and
# `proptest` are unoptimized-numeric-code-heavy and dominate test wall time
# when built at opt-level 0; `profile.test` inherits `profile.dev`, including
# package overrides, so this applies to `cargo nextest run` too. Costs one
# slow rebuild whenever this line (or a pinned dependency version) changes.
[profile.dev.package."*"]
opt-level = 2
