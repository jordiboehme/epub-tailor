name: Release

# Three ways in, one release tag. The `resolve` job below works it out once,
# and every later job reads its outputs, never the ref:
#
# - workflow_call: CI on main calls this after ci-passed when the workspace
#   version has no tag yet (scripts/release-check.sh). The tag comes from the
#   `tag` input; github.ref is the caller's (refs/heads/main) here, so it says
#   nothing about the release. The publish job creates the tag at the tested
#   commit (github.sha) first.
# - push of a `v*` tag: the fallback. The tag is the pushed ref.
# - workflow_dispatch: a dry run. It builds and packages everything and
#   publishes nothing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}
  workflow_call:
    inputs:
      tag:
        description: The tag to release, v<version> of the workspace Cargo.toml
        type: string
        required: true
    secrets:
      APPLE_CERTIFICATE_P12:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER_ID:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      TAP_GITHUB_TOKEN:
        required: false

env:
  CARGO_TERM_COLOR: always

# Read only by default. The publish job names the write scope it needs.
permissions:
  contents: read

jobs:
  # Resolves the release tag once for every job below, and stops a release
  # whose notes are missing before anything is built.
  #
  # Outputs:
  # - tag: the release tag, or empty for a dry run.
  # - publish: true when the run publishes (a call or a tag push).
  # - build: false only when a call finds its tag already at another commit,
  #   which means another release of this version won the race; then the run
  #   skips everything after this job and stays green.
  # - called: true for a call from CI, which has to create the tag.
  resolve:
    name: resolve the release tag
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
      build: ${{ steps.resolve.outputs.build }}
      called: ${{ steps.resolve.outputs.called }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # inputs.tag is set only by a call. A tag push and a dry run have no
      # inputs, and in a call GITHUB_REF_TYPE is the caller's (branch).
      - name: Resolve the release tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::the tag input '$tag' is not of the form vX.Y.Z"
              exit 1
            fi
            # The caller checked that the tag is new, but a second push to
            # main can pass that check while the first release still runs.
            # The tag at this commit is a re-run and goes on; the tag at
            # another commit means that release won, so this one stops here.
            at="$(bash scripts/release-check.sh tag-commit "$tag")"
            build=true
            if [ -n "$at" ] && [ "$at" != "$GITHUB_SHA" ]; then
              echo "release: $tag already points at $at, not at $GITHUB_SHA, so another run released it; nothing to do"
              build=false
            fi
            { echo "tag=$tag"; echo "publish=$build"; echo "build=$build"; echo "called=true"; } >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            { echo "tag=$GITHUB_REF_NAME"; echo "publish=true"; echo "build=true"; echo "called=false"; } >> "$GITHUB_OUTPUT"
          else
            { echo "tag="; echo "publish=false"; echo "build=true"; echo "called=false"; } >> "$GITHUB_OUTPUT"
          fi

      # The workspace version and the tag must agree: the bundler stamps the
      # app with the workspace version while latest.json advertises the tag's,
      # and if those two ever disagree the updater offers every user a release
      # they are already running. The notes must be there too, or the release
      # would fail only at the very end, after the whole build matrix.
      - name: Check the version and the release notes
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            echo "a dry run, nothing to check"
            exit 0
          fi
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::the tag $RELEASE_TAG does not match the workspace version $version: bump Cargo.toml (and Cargo.lock) or retag"
            exit 1
          fi
          file="release-notes/${RELEASE_TAG}.md"
          if [ ! -s "$file" ]; then
            echo "::error file=$file::$file is missing or empty. Add it to main (a merge releases again), or push the tag again after adding it."
            exit 1
          fi
          if ! head -1 "$file" | grep -qE '^# .+'; then
            echo "::error file=$file::$file must open with an H1, the release's motto."
            exit 1
          fi
          echo "release: $RELEASE_TAG matches the workspace version and $file is in place"

  build:
    name: build (${{ matrix.target }})
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            platform: macos-arm64
            os: macos-latest
            archive_ext: tar.gz
            codesign: true
          - target: x86_64-apple-darwin
            platform: macos-intel
            # macos-13 (the Intel image the brief named) was retired by
            # GitHub on 2025-12-04; macos-15-intel is the current Intel
            # macOS image.
            os: macos-15-intel
            archive_ext: tar.gz
            codesign: true
          - target: x86_64-unknown-linux-musl
            platform: linux-amd64
            os: ubuntu-latest
            archive_ext: tar.gz
            musl: true
          - target: aarch64-unknown-linux-musl
            platform: linux-arm64
            os: ubuntu-24.04-arm
            archive_ext: tar.gz
            musl: true
          - target: x86_64-pc-windows-msvc
            platform: windows-amd64
            os: windows-latest
            archive_ext: zip
            rustflags: '-C target-feature=+crt-static'
          - target: aarch64-pc-windows-msvc
            platform: windows-arm64
            os: windows-11-arm
            archive_ext: zip
            rustflags: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version; this installs exactly that and
      # adds the release target to it.
      - name: Install Rust toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          rustup show active-toolchain

      - name: Install musl-tools
        if: matrix.musl
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y musl-tools

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ]; then
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build epub-tailor
        run: cargo build --release -p epub-tailor --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Locate the built binary
        id: bin
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/epub-tailor"
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="target/${{ matrix.target }}/release/epub-tailor.exe"
          fi
          if [ ! -f "$bin" ]; then
            echo "::error::built binary not found at $bin"
            exit 1
          fi
          echo "path=$bin" >> "$GITHUB_OUTPUT"

      # No test suite here: CI tested exactly this tree before it reached
      # main. Every leg runs on a native runner for its target, so a quick
      # start of the release binary still proves each build runs at all.
      - name: Smoke test the release binary
        shell: bash
        env:
          BIN: ${{ steps.bin.outputs.path }}
        run: |
          set -euo pipefail
          "$BIN" --version

      # macOS code signing and notarization: sign the bare Mach-O with a
      # Developer ID Application certificate under the hardened runtime,
      # then notarize it with notarytool via an App Store Connect API key.
      # A bare binary cannot carry a stapled ticket, so Gatekeeper resolves
      # the notarization ticket online on first run; distribution stays a
      # plain tar.gz. Signing runs BEFORE staging so the same signed binary
      # flows into the archive and the Homebrew tap.
      - name: Decide whether to sign and notarize
        if: matrix.codesign
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=()
          for var in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID \
                     APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            [ -n "${!var:-}" ] || missing+=("$var")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          elif [ "${#missing[@]}" -eq 6 ] && [ -z "$RELEASE_TAG" ]; then
            echo "::notice::Apple signing secrets are not configured; this dry run produces an UNSIGNED macOS binary"
            echo "sign=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Apple signing secrets missing (${missing[*]}); a release build must sign and a partial secret set is always a misconfiguration"
            exit 1
          fi

      - name: Set up signing keychain
        if: matrix.codesign && steps.signing.outputs.sign == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          cert="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$cert"

      - name: Sign the binary
        if: matrix.codesign && steps.signing.outputs.sign == 'true'
        shell: bash
        env:
          BIN: ${{ steps.bin.outputs.path }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::no Developer ID Application identity found in the signing keychain"
            exit 1
          fi
          codesign --force --timestamp --options runtime \
            --identifier io.github.jordiboehme.epub-tailor \
            --keychain "$keychain" \
            --sign "$identity" \
            "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          info="$(codesign --display --verbose=2 "$BIN" 2>&1)"
          echo "$info"
          grep -q "Identifier=io.github.jordiboehme.epub-tailor" <<< "$info"
          grep -q "TeamIdentifier=${APPLE_TEAM_ID}" <<< "$info"
          grep -q "(runtime)" <<< "$info"

      - name: Notarize the binary
        if: matrix.codesign && steps.signing.outputs.sign == 'true'
        shell: bash
        env:
          BIN: ${{ steps.bin.outputs.path }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/asc-key.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          zip="$RUNNER_TEMP/notarize.zip"
          ditto -c -k "$BIN" "$zip"
          result="$RUNNER_TEMP/notarize-result.json"
          set +e
          xcrun notarytool submit "$zip" \
            --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$result"
          submit_rc=$?
          set -e
          cat "$result"
          status="$(jq -r '.status // "unknown"' "$result")"
          if [ "$submit_rc" -ne 0 ] || [ "$status" != "Accepted" ]; then
            echo "::error::notarization failed (notarytool exit $submit_rc, status $status)"
            submission_id="$(jq -r '.id // empty' "$result")"
            if [ -n "$submission_id" ]; then
              xcrun notarytool log "$submission_id" \
                --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" || true
            fi
            exit 1
          fi
          rm -f "$zip"

      # Proves the hardened runtime does not break the binary.
      - name: Smoke test the signed binary
        if: matrix.codesign && steps.signing.outputs.sign == 'true'
        shell: bash
        env:
          BIN: ${{ steps.bin.outputs.path }}
        run: |
          set -euo pipefail
          "$BIN" --version
          "$BIN" check --help

      - name: Delete signing keychain
        if: always() && matrix.codesign
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/asc-key.p8" "$RUNNER_TEMP/notarize.zip"

      - name: Stage archive contents
        id: stage
        shell: bash
        env:
          BIN: ${{ steps.bin.outputs.path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          name="epub-tailor-v${version}-${{ matrix.platform }}"
          stage="dist/$name"
          mkdir -p "$stage"
          cp "$BIN" "$stage/"
          cp LICENSE "$stage/"
          cp README.md "$stage/"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Package archive (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        working-directory: dist
        env:
          STAGE_NAME: ${{ steps.stage.outputs.name }}
        run: tar czf "${STAGE_NAME}.tar.gz" "${STAGE_NAME}"

      - name: Package archive (zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        working-directory: dist
        env:
          STAGE_NAME: ${{ steps.stage.outputs.name }}
        run: Compress-Archive -Path "${env:STAGE_NAME}/*" -DestinationPath "${env:STAGE_NAME}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: epub-tailor-${{ matrix.platform }}
          path: dist/${{ steps.stage.outputs.name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  # The desktop app (app/): a Tauri bundle per platform, with the CLI riding
  # along inside it as a sidecar. Separate from `build` on purpose - it needs
  # Node, a webview toolchain and the gnu (not musl) Linux targets, and a
  # broken bundler leg must not take the CLI release down with it.
  build-app:
    name: build app (${{ matrix.platform }})
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            family: macos
            # `app` is not redundant next to `dmg`: the updater artifact
            # (.app.tar.gz) is produced from the .app bundle, so the target has
            # to be asked for by name.
            bundles: app,dmg
          - platform: macos-intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            family: macos
            bundles: app,dmg
          - platform: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            family: windows
            bundles: nsis
          - platform: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            family: windows
            bundles: nsis
          # The CLI ships static musl binaries; the app cannot - it links
          # against the system webview - so the desktop legs build the gnu
          # triples, and the sidecar inside the bundle is a gnu build too.
          - platform: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            family: linux
            bundles: appimage,deb
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            family: linux
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version; this installs exactly that and
      # adds the release target to it.
      - name: Install Rust toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          rustup show active-toolchain

      # Tauri's Linux dependencies: the webview itself, the AppImage tooling's
      # helpers and patchelf, which the AppImage bundler shells out to.
      - name: Install Linux webview dependencies
        if: matrix.family == 'linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            xdg-utils

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No cache in a release: a cache written by another workflow could
          # put poisoned files into the shipped build. Release builds start
          # clean, the same reason they have no rust-cache.
          package-manager-cache: false

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # The bundler stamps the app with the cargo workspace's version, while
          # latest.json advertises the tag's. If those two ever disagree, the
          # updater offers every user a release they are already running - a
          # loop only a new tag can break. So a tag build insists they match.
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$crate" ]; then
            echo "::error::could not read the workspace version from Cargo.toml"
            exit 1
          fi
          if [ -n "$RELEASE_TAG" ]; then
            tag="$RELEASE_TAG"
            version="${tag#v}"
            if [ "$version" != "$crate" ]; then
              echo "::error::tag ${tag} does not match the workspace version ${crate}: bump Cargo.toml (and Cargo.lock) or retag, otherwise the updater will offer this release to the people already running it"
              exit 1
            fi
          else
            # A dry run has no tag, so it packages what the workspace says it is.
            version="$crate"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # tauri.conf.json's beforeBuildCommand runs prepare-sidecar again (with
      # TAURI_ENV_TARGET_TRIPLE set, so it resolves the same triple), but doing
      # it up front turns "the CLI does not compile for this target" into its own
      # red step instead of a failure buried in the bundler's output.
      - name: Build the CLI sidecar
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p epub-tailor --target ${{ matrix.target }}
          node app/scripts/prepare-sidecar.mjs --target ${{ matrix.target }}

      # Same gate as the CLI's `build` job: a tag build must be fully signed; a
      # secretless workflow_dispatch dry run is allowed to produce an unsigned
      # bundle; and a half-configured secret set is always an error.
      #
      # The Apple variables are exported through $GITHUB_ENV rather than the
      # build step's `env:` block because Tauri decides whether to sign by
      # asking whether APPLE_CERTIFICATE *exists*. An `env:` entry fed by a
      # missing secret exists - it is just empty - and Tauri would then try to
      # import an empty certificate and fail. Absent has to mean absent.
      - name: Decide whether to sign and notarize
        if: matrix.family == 'macos'
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=()
          for var in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID \
                     APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            [ -n "${!var:-}" ] || missing+=("$var")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            key="$RUNNER_TEMP/asc-key.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
            chmod 600 "$key"
            # The names on the left are the ones Tauri's bundler reads
            # (https://v2.tauri.app/reference/environment-variables); the repo's
            # secrets predate the app and are named for the CLI's notarytool
            # invocation, hence the remapping.
            #
            # Squeezed onto one line each: $GITHUB_ENV's KEY=value form cannot
            # carry a newline, and Tauri base64-decodes APPLE_CERTIFICATE
            # strictly, where the CLI job's `base64 --decode` shrugs newlines
            # off. A p12 exported with `openssl base64` (wrapped at 64 columns)
            # or a secret pasted from a file therefore has to be flattened -
            # which costs nothing, as none of these values can contain
            # meaningful whitespace. The password keeps its spaces, if any.
            #
            # Every squeezed value is then re-registered with ::add-mask::.
            # GitHub masks the exact strings it holds as secrets, and a value we
            # transformed is not one of them any more: without this, a p12 that
            # arrived wrapped at 64 columns would be one accidental `echo` away
            # from appearing in a public log in full.
            oneline() { printf '%s' "$1" | tr -d '[:space:]'; }
            mask() { if [ -n "$1" ]; then echo "::add-mask::$1"; fi; }

            certificate="$(oneline "$APPLE_CERTIFICATE_P12")"
            certificate_password="$(printf '%s' "$APPLE_CERTIFICATE_PASSWORD" | tr -d '\r\n')"
            team_id="$(oneline "$APPLE_TEAM_ID")"
            api_key="$(oneline "$APPLE_API_KEY_ID")"
            api_issuer="$(oneline "$APPLE_API_ISSUER_ID")"
            for value in "$certificate" "$certificate_password" "$team_id" "$api_key" "$api_issuer"; do
              mask "$value"
            done

            {
              echo "APPLE_CERTIFICATE=$certificate"
              echo "APPLE_CERTIFICATE_PASSWORD=$certificate_password"
              echo "APPLE_TEAM_ID=$team_id"
              echo "APPLE_API_KEY=$api_key"
              echo "APPLE_API_ISSUER=$api_issuer"
              echo "APPLE_API_KEY_PATH=$key"
            } >> "$GITHUB_ENV"
            # APPLE_SIGNING_IDENTITY is deliberately not set: with
            # APPLE_CERTIFICATE present, Tauri imports the .p12 into a throwaway
            # keychain of its own and infers the Developer ID identity from it.
            echo "sign=true" >> "$GITHUB_OUTPUT"
          elif [ "${#missing[@]}" -eq 6 ] && [ -z "$RELEASE_TAG" ]; then
            echo "::notice::Apple signing secrets are not configured; this dry run produces an UNSIGNED, unnotarized macOS bundle"
            echo "sign=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Apple signing secrets missing (${missing[*]}); a release build must sign and a partial secret set is always a misconfiguration"
            exit 1
          fi

      # The updater key signs the .app.tar.gz / NSIS / AppImage artifacts that
      # latest.json points at; the app verifies that signature against the public
      # key baked into tauri.conf.json before installing anything. With
      # createUpdaterArtifacts on, a build without a private key does not warn -
      # it fails ("A public key has been found, but no private key") - so a dry
      # run without the secret gets a throwaway key: it exercises the exact same
      # bundling path, and nothing it signs is ever published.
      - name: Resolve the updater signing key
        shell: bash
        # For the dry-run branch's `npx tauri`: the pinned CLI lives in app/.
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # The key is passed through VERBATIM. Tauri accepts either one line of
          # base64 or the raw two-line minisign key file, and squeezing the
          # whitespace out of it (as the Apple gate above safely does to values
          # that cannot contain any) silently welds those two lines into one:
          # the bundler then reports "Missing encoded key in secret key", which
          # reads like a wrong password and is not. $GITHUB_ENV carries a
          # multi-line value through its heredoc form, so neither shape needs
          # touching. Only a trailing newline is trimmed, which `$(...)` already
          # does for us.
          mask() { if [ -n "$1" ]; then echo "::add-mask::$1"; fi; }

          # A multi-line value has to be masked line by line: GitHub masks
          # literal strings, and it never sees the whole key as one.
          mask_lines() { while IFS= read -r line; do mask "$line"; done <<< "$1"; }

          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ] && [ -n "$RELEASE_TAG" ]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set; a release build with TAURI_SIGNING_PRIVATE_KEY configured needs its password too, or the bundler fails deep inside minisign with an opaque decrypt error"
              exit 1
            fi
            signing_key_password="$(printf '%s' "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" | tr -d '\r\n')"
            mask_lines "$TAURI_SIGNING_PRIVATE_KEY"
            mask "$signing_key_password"
            {
              echo "TAURI_SIGNING_PRIVATE_KEY<<TAURI_KEY_EOF"
              printf '%s\n' "$TAURI_SIGNING_PRIVATE_KEY"
              echo "TAURI_KEY_EOF"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$signing_key_password"
            } >> "$GITHUB_ENV"
          elif [ -z "$RELEASE_TAG" ]; then
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY is not configured; this dry run signs its updater artifacts with a throwaway key that no released app trusts"
            npx tauri signer generate -w "$RUNNER_TEMP/updater-dry-run.key" -f --ci
            # Verbatim, for the reason the real-key branch above spells out: the
            # generated file is the raw two-line key, and flattening it would
            # make the bundler reject the key it just made. Nothing this key
            # signs is ever published, but it is still a private key printed
            # into a public log if anything ever echoes it.
            throwaway_key="$(cat "$RUNNER_TEMP/updater-dry-run.key")"
            mask_lines "$throwaway_key"
            {
              echo "TAURI_SIGNING_PRIVATE_KEY<<TAURI_KEY_EOF"
              printf '%s\n' "$throwaway_key"
              echo "TAURI_KEY_EOF"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD="
            } >> "$GITHUB_ENV"
          else
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set; a release build cannot publish updater artifacts nobody can verify"
            exit 1
          fi

      # Signing, notarization and updater signing are all driven by the
      # environment the two steps above prepared - see them for what is set and
      # why. Tauri signs the .app and the CLI sidecar nested inside it under the
      # hardened runtime, notarizes the app and staples the ticket to it.
      - name: Build the app bundles
        working-directory: app
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Stage the bundles
        id: stage
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          bundle="target/${{ matrix.target }}/release/bundle"
          base="EPUB-Tailor-v${version}-${{ matrix.platform }}"
          mkdir -p dist-app

          # The bundler names its output after the product ("EPUB Tailor_0.4.2
          # _aarch64.dmg"), spaces and all; the release uses the repo's
          # convention. Exactly one match is required for every artifact: a
          # missing .sig quietly dropped here is a hole in latest.json later,
          # and a hole in latest.json is a platform that can never update again.
          take() {
            local pattern="$1"
            local dest="$2"
            local found=()
            while IFS= read -r -d '' f; do found+=("$f"); done \
              < <(find "$bundle" -type f -name "$pattern" -print0)
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::expected exactly one file matching '$pattern' under $bundle, found ${#found[@]}"
              exit 1
            fi
            cp "${found[0]}" "dist-app/$dest"
          }

          case "${{ matrix.family }}" in
            macos)
              take '*.dmg' "$base.dmg"
              take '*.app.tar.gz' "$base.app.tar.gz"
              take '*.app.tar.gz.sig' "$base.app.tar.gz.sig"
              echo "dmg=dist-app/$base.dmg" >> "$GITHUB_OUTPUT"
              ;;
            windows)
              take '*-setup.exe' "$base-setup.exe"
              take '*-setup.exe.sig' "$base-setup.exe.sig"
              ;;
            linux)
              take '*.AppImage' "$base.AppImage"
              take '*.AppImage.sig' "$base.AppImage.sig"
              take '*.deb' "$base.deb"
              ;;
          esac
          ls -la dist-app

      # Tauri notarizes and staples the .app, but not the disk image it then
      # wraps it in - and an unstapled DMG makes Gatekeeper phone home on first
      # open, or refuse outright if the machine is offline. So the DMG gets its
      # own trip through notarytool, and `spctl` proves the result the way the
      # user's Mac will see it.
      - name: Notarize and staple the DMG
        if: matrix.family == 'macos' && steps.signing.outputs.sign == 'true'
        shell: bash
        env:
          DMG: ${{ steps.stage.outputs.dmg }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          dmg="$DMG"
          key="$RUNNER_TEMP/asc-key.p8"
          result="$RUNNER_TEMP/dmg-notarize.json"
          set +e
          xcrun notarytool submit "$dmg" \
            --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$result"
          submit_rc=$?
          set -e
          cat "$result"
          status="$(jq -r '.status // "unknown"' "$result")"
          if [ "$submit_rc" -ne 0 ] || [ "$status" != "Accepted" ]; then
            echo "::error::DMG notarization failed (notarytool exit $submit_rc, status $status)"
            submission_id="$(jq -r '.id // empty' "$result")"
            if [ -n "$submission_id" ]; then
              xcrun notarytool log "$submission_id" \
                --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" || true
            fi
            exit 1
          fi
          # Apple has accepted the DMG at this point. The staple step only
          # fetches the ticket from Apple's CDN, and that fetch sometimes
          # loses its connection (stapler exit 68). Try a few times before
          # failing a release that is otherwise done.
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "$dmg"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::stapling the DMG failed 5 times"
              exit 1
            fi
            echo "stapling failed (attempt $attempt), retrying in 30 seconds"
            sleep 30
          done
          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -vv "$dmg"

      - name: Delete the App Store Connect key
        if: always() && matrix.family == 'macos'
        shell: bash
        run: rm -f "$RUNNER_TEMP/asc-key.p8"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: epub-tailor-app-${{ matrix.platform }}
          path: dist-app/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: [resolve, build, build-app]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A call from CI and a tag push publish; workflow_dispatch stops after the
    # build matrix above, so it works as a dry run.
    if: needs.resolve.outputs.publish == 'true'
    permissions:
      contents: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: downloads

      # Everything both matrices produced: the CLI archives (.tar.gz/.zip), the
      # app bundles (.dmg/.exe/.AppImage/.deb), the updater artifacts
      # (.app.tar.gz) and their detached signatures (.sig). The checksums cover
      # the lot - the Homebrew cask reads the DMG's sha256 straight out of this
      # file, and so can anyone else.
      - name: Collect artifacts and generate checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find downloads -type f \( \
            -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' -o -name '*.exe' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.sig' \
          \) -exec cp {} release/ \;
          cd release
          sha256sum -- * > SHA256SUMS
          ls -la

      # The updater's manifest. Every desktop platform we ship must appear here
      # with the signature of the artifact it will download: a platform missing
      # from latest.json can never update itself again, and a published release
      # is not something you can quietly take back. So a missing artifact or a
      # missing .sig fails the release outright rather than shipping a hole.
      #
      # Schema per https://v2.tauri.app/plugin/updater ("Static JSON File").
      # The endpoint the app polls is
      # /releases/latest/download/latest.json, which resolves against the
      # latest published release, so the update goes out the moment the
      # release below is published.
      - name: Generate latest.json for the updater
        run: |
          set -euo pipefail
          tag="$TAG"
          version="${tag#v}"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          missing=0
          platforms='{}'

          add_platform() {
            local key="$1"
            local file="$2"
            if [ ! -f "release/$file" ] || [ ! -f "release/$file.sig" ]; then
              echo "::error::updater artifact missing for ${key}: expected release/${file} and release/${file}.sig"
              missing=1
              return
            fi
            platforms="$(jq -n \
              --argjson platforms "$platforms" \
              --arg key "$key" \
              --arg signature "$(cat "release/$file.sig")" \
              --arg url "${base_url}/${file}" \
              '$platforms + { ($key): { signature: $signature, url: $url } }')"
          }

          add_platform darwin-aarch64 "EPUB-Tailor-v${version}-macos-arm64.app.tar.gz"
          add_platform darwin-x86_64 "EPUB-Tailor-v${version}-macos-intel.app.tar.gz"
          add_platform windows-x86_64 "EPUB-Tailor-v${version}-windows-amd64-setup.exe"
          add_platform windows-aarch64 "EPUB-Tailor-v${version}-windows-arm64-setup.exe"
          add_platform linux-x86_64 "EPUB-Tailor-v${version}-linux-amd64.AppImage"
          add_platform linux-aarch64 "EPUB-Tailor-v${version}-linux-arm64.AppImage"

          if [ "$missing" -ne 0 ]; then
            echo "::error::refusing to publish a latest.json with a hole in it - the platforms listed above would be stuck on their current version forever"
            exit 1
          fi

          jq -n \
            --arg version "$version" \
            --arg notes "EPUB Tailor ${tag}. The full notes are at https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{ version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms }' \
            > release/latest.json
          cat release/latest.json

      # Only for a call from CI: a tag push brought its tag along. An annotated
      # tag, made through the API because the checkout keeps no credentials.
      # A tag made with the workflow token starts no other workflow, so this
      # run is the only release of it. The tag already at this commit is a
      # re-run of a failed publish; at another commit it is an error, never
      # moved.
      - name: Create the tag at the tested commit
        if: needs.resolve.outputs.called == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          at="$(bash scripts/release-check.sh tag-commit "$TAG")"
          if [ -n "$at" ]; then
            if [ "$at" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already points at $at, not at the tested commit $GITHUB_SHA"
              exit 1
            fi
            echo "release: $TAG already points at $GITHUB_SHA"
            exit 0
          fi
          object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$TAG" -f message="$TAG" -f object="$GITHUB_SHA" -f type=commit \
            --jq .sha)"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$object" > /dev/null
          echo "release: tagged $GITHUB_SHA as $TAG"

      # Published right away: the notes were reviewed in the pull request
      # that bumped the version (release-notes/<tag>.md).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release/* \
            --verify-tag \
            --title "$TAG" \
            --notes-file "release-notes/${TAG}.md"

  # The tap update. A release published with the workflow token fires no
  # `release: published` event, so homebrew.yml is called directly.
  homebrew:
    name: homebrew
    needs: [resolve, publish]
    if: needs.resolve.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew.yml  # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.resolve.outputs.tag }}
    secrets:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
